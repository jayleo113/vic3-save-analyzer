[project]
name = "vic3-save-analyzer"
version = "0.1.0"
description = "Victoria 3 save parser and report exporter for economy, population, diplomacy, wars, companies, and social structure."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "jayleo113" }]
keywords = [
  "victoria-3",
  "vic3",
  "victoria3",
  "paradox",
  "save-parser",
  "save-analyzer",
  "jomini",
  "grand-strategy",
  "deepseek",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jayleo113/vic3-save-analyzer"
Issues = "https://github.com/jayleo113/vic3-save-analyzer/issues"

[tool.ruff]
line-length = 160
target-version = "py310"
